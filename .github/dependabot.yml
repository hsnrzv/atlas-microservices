# Weekly, grouped dependency updates. Major versions of the platform (Spring Boot, Java base images)
# are reviewed deliberately: they arrive as separate PRs and must update docs/adr/0007 when accepted.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.modulith:*"
        update-types: [minor, patch]
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
      other-maven:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework.boot:*"
          - "org.springframework.modulith:*"
          - "org.apache.maven.plugins:*"
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    # Stay on the Java 21 LTS line; a new Java major is an ADR decision, not a bot update.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # PostgreSQL major upgrades need a dump/restore or pg_upgrade plan (docs/plan/PLAN-DATABASE.md).
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
