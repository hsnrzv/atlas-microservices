name: backend-container

# Builds, smoke-tests and scans the image on every PR and on main, WITHOUT pushing.
# BE-1.13: Trivy image scan (fixable CRITICAL/HIGH fail; exceptions in .trivyignore) and a CycloneDX image SBOM.
# Publishing immutable images to ghcr.io/hsnrzv/atlas-backend (provenance, then a PR to atlas-infra to bump the
# digest) is BE-2.4 and follows atlas-infra ADR-0007, so no registry credentials or `packages: write` permission
# exist before the deployment path has been reviewed.
# See docs/plan/PLAN-BACKEND.md (backlog) and atlas-infra docs/plan/PLAN-INFRASTRUCTURE-CICD.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: atlas-backend:ci

jobs:
  build-image:
    name: Build and smoke-test image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (PostgreSQL 18 + health probes)
        run: |
          set -euo pipefail
          docker network create atlas-smoke
          # Throwaway CI-only database credentials.
          docker run -d --name atlas-smoke-db --network atlas-smoke \
            -e POSTGRES_DB=atlas -e POSTGRES_USER=atlas -e POSTGRES_PASSWORD=atlas \
            postgres:18.6-alpine
          for _ in $(seq 1 30); do
            docker exec atlas-smoke-db pg_isready -U atlas -d atlas >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name atlas-smoke-app --network atlas-smoke -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://atlas-smoke-db:5432/atlas \
            -e SPRING_DATASOURCE_USERNAME=atlas \
            -e SPRING_DATASOURCE_PASSWORD=atlas \
            "$IMAGE"
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for path in /actuator/health /actuator/health/liveness /actuator/health/readiness; do
            echo "$path -> $(curl -fsS "http://localhost:8080$path")"
            curl -fsS "http://localhost:8080$path" | grep -q '"status":"UP"'
          done
          test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"

      - name: Container logs
        if: always()
        run: docker logs atlas-smoke-app 2>&1 | tail -n 200 || true

      # Trivy (Apache-2.0): same pinned action commit, scanner version and policy as atlas F2-11 (shared scanner,
      # atlas-infra ADR-0007). Scans OS packages and the application jars. Fixable CRITICAL and HIGH findings fail
      # the job; an accepted finding goes into .trivyignore with a reason and an expiry date.
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: CycloneDX SBOM of the image (OS packages and jars)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: atlas-backend-image.cdx.json
          skip-setup-trivy: true

      - name: Upload image SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-image-sbom
          path: atlas-backend-image.cdx.json
          retention-days: 30
          if-no-files-found: warn
