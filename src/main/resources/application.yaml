# Common configuration for every profile (local, dev, staging, prod) and tests.
# Environment-specific values come from environment variables, never from this file:
#   SPRING_PROFILES_ACTIVE, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# See README.md#configuration.
spring:
  application:
    name: atlas-backend
  docker:
    compose:
      # Only the 'local' profile starts compose.yaml (see application-local.yaml).
      enabled: false
  datasource:
    hikari:
      pool-name: atlas-db
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000 # ms
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates mappings against it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: atlas
  flyway:
    enabled: true
    default-schema: atlas
    schemas: atlas
    create-schemas: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      # JSON (Elastic Common Schema) logs outside 'local'; application-local.yaml switches to plain text.
      console: ecs
