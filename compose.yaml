# LOCAL DEVELOPMENT ONLY - backend-only database for `./mvnw spring-boot:run -Dspring-boot.run.profiles=local`.
# spring-boot-docker-compose starts this file and derives the datasource from the service below.
# The credentials are throwaway local values (atlas/atlas/atlas) and must never be used in any shared
# or deployed environment. The full local stack (frontend + backend + edge proxy) lives in atlas-infra/local.
name: atlas-backend-local

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas # LOCAL ONLY
    ports:
      # Host port defaults to 5432 (cross-repo contract). Override if 5432 is taken, e.g. by a native
      # PostgreSQL: ATLAS_DB_PORT=15432 ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
      - "${ATLAS_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - atlas-postgres-data:/var/lib/postgresql
    labels:
      dev.myatlas.environment: local-only

volumes:
  atlas-postgres-data:
